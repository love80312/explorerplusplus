name: Build Explorer++ Language DLL

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bootstrap vcpkg
      run: |
        if (Test-Path "Explorer++/ThirdParty/vcpkg/bootstrap-vcpkg.bat") {
          ./Explorer++/ThirdParty/vcpkg/bootstrap-vcpkg.bat
        }

    - name: Build Win32 DLL
      # 32 位元通常在 .sln 中已有定義，直接編譯方案檔最保險
      run: |
        msbuild "Explorer++/Explorer++.sln" `
          -t:Translations\Explorer++ZH_TW `
          -p:Configuration=Release `
          -p:Platform=Win32 `
          -p:PlatformToolset=v143

    - name: Build x64 DLL
      # 直接編譯專案檔，並手動指定 SolutionDir 以便找到 Toolset.props
      # 使用 $env:GITHUB_WORKSPACE 取得絕對路徑
      run: |
        msbuild "Translations/Explorer++ZH_TW/Explorer++ZH_TW.vcxproj" `
          -p:Configuration=Release `
          -p:Platform=x64 `
          -p:PlatformToolset=v143 `
          -p:SolutionDir="$env:GITHUB_WORKSPACE/Explorer++/"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Explorer++-Traditional-Chinese-DLLs
        path: |
          **/Explorer++ZH_TW.dll
