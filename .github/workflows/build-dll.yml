name: Build Explorer++ ZH_TW DLL

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bootstrap vcpkg
      # 雖然專案檔中 VcpkgEnabled 為 false，但為了保證編譯環境完整建議保留
      run: |
        if (Test-Path "Explorer++/ThirdParty/vcpkg/bootstrap-vcpkg.bat") {
          ./Explorer++/ThirdParty/vcpkg/bootstrap-vcpkg.bat
        }

    - name: Build Language DLL (Release Win32)
      run: |
        msbuild Explorer++ZH_TW.vcxproj `
          -property:Configuration=Release `
          -property:Platform=Win32 `
          -property:PlatformToolset=v143 `
          -property:WindowsTargetPlatformVersion=10.0

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Explorer++ZH_TW-Win32-DLL
        path: |
          **/Win32/Release/Explorer++ZH_TW.dll
